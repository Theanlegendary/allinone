name: Build iOS & Deploy to Apple TestFlight

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    name: 🍏 Build iOS IPA & TestFlight
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🛠️ Build iOS App (No Codesign for Artifact / Archive)
        run: |
          flutter build ios --release --no-codesign

      - name: 📦 Package .app into Payload (.ipa)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ZenNight-iOS-Release.ipa Payload
          mkdir -p build/ios/ipa
          mv ZenNight-iOS-Release.ipa build/ios/ipa/

      - name: 📤 Upload Production iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zennight-ios-ipa
          path: build/ios/ipa/ZenNight-iOS-Release.ipa

      - name: 🚀 Upload to TestFlight (If App Store Connect Secrets Configured)
        if: ${{ env.APP_STORE_CONNECT_API_KEY != '' }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Setting up Apple App Store Connect API Key..."
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          
          echo "Uploading IPA to Apple App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            -f build/ios/ipa/ZenNight-iOS-Release.ipa \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
