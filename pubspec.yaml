name: relax_mindfulness
description: iOS-inspired ambient meditation, breathing timer, relaxation sound mixer, and sleep stories app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
