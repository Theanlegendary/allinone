  <style>
    /* ── Global Reset & iOS feel ── */
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* Remove iOS tap flash */
      -webkit-touch-callout: none; /* Disable iOS callout (long press menu) */
    }

    html {
      height: 100%;
      /* Prevent elastic over-scroll bounce on iOS — makes it feel truly native */
      overscroll-behavior: none;
    }

    body {
      height: 100%;
      background-color: #071018;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* Prevent text size adjustment on iOS orientation change */
      -webkit-text-size-adjust: 100%;
      /* Prevent pull-to-refresh on Chrome/Android */
      overscroll-behavior-y: none;
    }

    /* Prevent all scroll on the root for full-screen app feel */
    #flutter_target {
      height: 100%;
      width: 100%;
    }

    /* ── Branded Loading Splash Screen ── */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(165deg, #071018 0%, #0B1A24 50%, #071018 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      /* Critical: hardware accelerate for smooth GPU fade */
      will-change: opacity;
      transform: translateZ(0);
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-glow {
      width: 96px; height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, #14B8A6 0%, #2DD4BF 60%, #5EEAD4 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px;
      box-shadow:
        0 0 0 0 rgba(45, 212, 191, 0.4),
        0 12px 48px rgba(45, 212, 191, 0.35),
        0 4px 16px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
      animation: splashPulse 2.2s ease-in-out infinite;
      will-change: transform, box-shadow;
    }

    .splash-title {
      color: #F0F8F9;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.6px;
      font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
    }

    .splash-sub {
      color: rgba(94, 234, 212, 0.6);
      font-size: 13.5px;
      margin-top: 8px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* Animated loading dots */
    .splash-dots {
      display: flex;
      gap: 6px;
      margin-top: 32px;
    }

    .splash-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(45, 212, 191, 0.5);
      animation: dotBounce 1.4s ease-in-out infinite;
    }

    .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
    .splash-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes splashPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(45,212,191,0.4), 0 12px 48px rgba(45,212,191,0.35), 0 4px 16px rgba(0,0,0,0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 16px rgba(45,212,191,0.0), 0 16px 64px rgba(45,212,191,0.5), 0 4px 24px rgba(0,0,0,0.5);
      }
    }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1.0); opacity: 1; background: rgba(45, 212, 191, 0.9); }
    }

    /* ── Responsive viewport fix: forces true full-screen on iOS ── */
    @supports (padding-top: env(safe-area-inset-top)) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }
  </style>

<body>

  <!-- iOS-feel branded launch screen -->
  <div id="splash">
    <div class="splash-glow">🪷</div>
    <div class="splash-title">Sanctuary</div>
    <div class="splash-sub">Your sanctuary for peace &amp; calm</div>
    <div class="splash-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // ── Instant splash hide when Flutter paints first frame ──
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function() {
          splash.remove();
        }, 650);
      }
    });

    // ── iOS Standalone mode: prevent link navigation out of PWA ──
    if (window.navigator.standalone) {
      document.addEventListener('click', function(e) {
        var a = e.target.closest('a');
        if (a && a.href && a.href.startsWith(window.location.origin)) {
          e.preventDefault();
        }
      }, false);
    }

    // ── Prevent iOS rubber-band scroll on the document ──
    document.addEventListener('touchmove', function(e) {
      if (e.target === document.body || e.target === document.documentElement) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
