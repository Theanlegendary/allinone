  <!-- ── Google Fonts (Inter + Outfit) ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%; 
      background-color: #080F16; 
      font-family: 'Inter', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Loading splash screen */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0B1A24 0%, #080F16 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-icon {
      width: 80px; height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2DD4BF, #14B8A6);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      box-shadow: 0 8px 32px rgba(45, 212, 191, 0.4);
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    .splash-title {
      color: #F0F6F8;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .splash-sub {
      color: rgba(176, 207, 215, 0.6);
      font-size: 13px;
      margin-top: 6px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(45, 212, 191, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 12px 48px rgba(45, 212, 191, 0.6); }
    }
  </style>
</head>
<body>
  <!-- Branded Loading Splash -->
  <div id="splash">
    <div class="splash-icon">🪷</div>
    <div class="splash-title">Relax & Mindfulness</div>
    <div class="splash-sub">Your sanctuary for peace & calm</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide splash when Flutter app is ready
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function() { splash.remove(); }, 600);
      }
    });
  </script>
</body>
